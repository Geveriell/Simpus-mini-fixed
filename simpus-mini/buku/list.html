<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Daftar Buku</title>
    <script>document.documentElement.classList.add("js");</script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle" aria-label="Buka menu" aria-controls="menu-utama" aria-expanded="false">&#9776;</button>
        <nav id="menu-utama">
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html" aria-current="page">Daftar Buku</a></li>
                <li><a href="../buku/tambah.html">Tambah Buku</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
                <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
                <li><a href="../login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Daftar Buku</h2>
            <div class="search-box">
                <label for="search-input">Cari Judul Buku</label>
                <input type="search" id="search-input" data-kolom="0" placeholder="Ketik judul buku..." autocomplete="off">
            </div>
            <p id="loading-indicator" class="status" hidden>Memuat data...</p>
            <p id="info-cadangan" class="status status-info" hidden></p>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                        <th>Judul</th>
                        <th>Pengarang</th>
                        <th>Tahun</th>
                        <th>Stok</th>
                        <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Baris diisi dinamis oleh buku.js via fetch('../data/buku.json') -->
                    </tbody>
                </table>
            </div>
            <p id="pesan-kosong" class="status" hidden>Tidak ada data yang cocok.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Proyek Jobsheet 1&ndash;6</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/simpus-data.js"></script>
    <script src="../assets/js/data-cadangan.js"></script>
    <script src="../assets/js/buku.js"></script>
</body>
</html>
