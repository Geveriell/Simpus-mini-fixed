<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Login</title>
    <script>document.documentElement.classList.add("js");</script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle" aria-label="Buka menu" aria-controls="menu-utama" aria-expanded="false">&#9776;</button>
        <nav id="menu-utama">
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="buku/list.html">Daftar Buku</a></li>
                <li><a href="buku/tambah.html">Tambah Buku</a></li>
                <li><a href="anggota/list.html">Daftar Anggota</a></li>
                <li><a href="anggota/tambah.html">Tambah Anggota</a></li>
                <li><a href="login.html" aria-current="page">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Login Petugas</h2>
            <p class="intro">Masuk untuk menambah data buku dan anggota.</p>
            <form id="form-tambah" novalidate>
                <p>
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username">
                </p>
                <p>
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password">
                </p>
                <p>
                    <button type="submit" class="btn btn-primary">Masuk</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Proyek Jobsheet 1&ndash;6</p>
    </footer>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/simpus-data.js"></script>
</body>
</html>
