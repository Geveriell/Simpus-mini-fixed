<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Daftar Anggota</title>
    <script>document.documentElement.classList.add("js");</script>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <button type="button" id="nav-toggle-btn" class="nav-toggle" aria-label="Buka menu" aria-controls="menu-utama" aria-expanded="false">&#9776;</button>
        <nav id="menu-utama">
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html">Daftar Buku</a></li>
                <li><a href="../buku/tambah.html">Tambah Buku</a></li>
                <li><a href="../anggota/list.html" aria-current="page">Daftar Anggota</a></li>
                <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
                <li><a href="../login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Daftar Anggota</h2>
            <div class="search-box">
                <label for="search-input">Cari Nama Anggota</label>
                <input type="search" id="search-input" data-kolom="1" placeholder="Ketik nama anggota..." autocomplete="off">
            </div>
            <p id="loading-indicator" class="status" hidden>Memuat data...</p>
            <p id="info-cadangan" class="status status-info" hidden></p>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                        <th>No. Anggota</th>
                        <th>Nama</th>
                        <th>Alamat</th>
                        <th>No. HP</th>
                        <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Baris diisi dinamis oleh anggota.js via fetch('../data/anggota.json') -->
                    </tbody>
                </table>
            </div>
            <p id="pesan-kosong" class="status" hidden>Tidak ada data yang cocok.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Proyek Jobsheet 1&ndash;6</p>
    </footer>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/simpus-data.js"></script>
    <script src="../assets/js/data-cadangan.js"></script>
    <script src="../assets/js/anggota.js"></script>
</body>
</html>
